apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicrm-stub
  namespace: crm-healthcare
  labels:
    app: aicrm-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicrm-stub
  template:
    metadata:
      labels:
        app: aicrm-stub
    spec:
      containers:
        - name: stub
          image: aicrm-stub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
            - name: CRM_CALLBACK_URL
              value: "http://aicrm-backend-service:8000/api/callbacks"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aicrm-stub-service
  namespace: crm-healthcare
spec:
  type: ClusterIP
  selector:
    app: aicrm-stub
  ports:
    - port: 8001
      targetPort: 8001
      name: http
