apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicrm-frontend
  namespace: crm-healthcare
  labels:
    app: aicrm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicrm-frontend
  template:
    metadata:
      labels:
        app: aicrm-frontend
    spec:
      containers:
        - name: frontend
          image: aicrm-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aicrm-frontend-service
  namespace: crm-healthcare
spec:
  type: NodePort
  selector:
    app: aicrm-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
