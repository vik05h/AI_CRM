apiVersion: v1
kind: Service
metadata:
  name: aicrm-backend-service
  namespace: crm-healthcare
  labels:
    app: aicrm-backend
    role: production-active
spec:
  type: NodePort
  selector:
    app: aicrm-backend
    version: blue
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: aicrm-backend-test-service
  namespace: crm-healthcare
  labels:
    app: aicrm-backend
    role: staging-test
spec:
  type: ClusterIP
  selector:
    app: aicrm-backend
    version: green
  ports:
    - port: 8000
      targetPort: 8000
      name: http
