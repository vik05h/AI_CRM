apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicrm-backend-green
  namespace: crm-healthcare
  labels:
    app: aicrm-backend
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aicrm-backend
      version: green
  template:
    metadata:
      labels:
        app: aicrm-backend
        version: green
    spec:
      containers:
        - name: backend
          image: aicrm-backend:green
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: aicrm-config
            - secretRef:
                name: aicrm-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
