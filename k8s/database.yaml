apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aicrm-postgres-pvc
  namespace: crm-healthcare
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicrm-database
  namespace: crm-healthcare
  labels:
    app: aicrm-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicrm-db
  template:
    metadata:
      labels:
        app: aicrm-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "aicrm"
            - name: POSTGRES_PASSWORD
              value: "aicrmpassword"
            - name: POSTGRES_DB
              value: "aicrm"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aicrm", "-d", "aicrm"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: aicrm-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aicrm-db-service
  namespace: crm-healthcare
spec:
  type: ClusterIP
  selector:
    app: aicrm-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
