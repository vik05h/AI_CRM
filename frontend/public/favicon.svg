<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="favBanana" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="#334155" stroke-width="2"/>

  <!-- Banana Silhouette -->
  <path d="M 24 12 
           C 28 17, 36 30, 32 44 
           C 30 51, 23 54, 18 51 
           C 14 47, 14 39, 16 29 
           C 18 20, 22 14, 24 12 Z" 
        fill="url(#favBanana)"/>
  
  <!-- Stem -->
  <path d="M 24 12 C 25 9, 27 7, 29 7 C 30 8, 29 10, 27 12 Z" fill="#65a30d"/>
  
  <!-- Cyber Goggles -->
  <rect x="18" y="24" width="16" height="8" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="20" y="25.5" width="4.5" height="5" rx="1.5" fill="#38bdf8"/>
  <rect x="27.5" y="25.5" width="4.5" height="5" rx="1.5" fill="#38bdf8"/>

  <!-- High-Tech AI Spark / Lightning Bolt -->
  <path d="M 44 14 L 33 32 L 41 32 L 35 50 L 52 28 L 43 28 Z" 
        fill="url(#favCyan)" 
        stroke="#e0f2fe" 
        stroke-width="1.2" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
