<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Glass Surface -->
    <linearGradient id="glassChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141720" stop-opacity="0.9" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #86efac); }
      50% { opacity: 0.3; filter: none; }
    }

    @keyframes pulseCyan {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 0.25; filter: none; }
    }

    @keyframes dataStream {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.45; }
      100% { transform: translateY(180px); opacity: 0.1; }
    }

    @keyframes coreSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes shimmerBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .led-emerald { animation: pulseLed 1.6s ease-in-out infinite; }
    .led-emerald-alt { animation: pulseLed 2.1s 0.4s ease-in-out infinite; }
    .led-cyan { animation: pulseCyan 1.8s 0.2s ease-in-out infinite; }

    .stream-line {
      stroke-dasharray: 6 6;
      animation: dataStream 1.2s linear infinite;
    }

    .scanner {
      animation: scanLine 3s linear infinite;
    }

    .core-rings {
      transform-origin: 100px 145px;
      animation: coreSpin 16s linear infinite;
    }

    .shimmer {
      animation: shimmerBar 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="540" height="340" rx="20" fill="url(#proBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Subtle Minimal Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="68" x2="540" y2="68" />
    <line x1="0" y1="136" x2="540" y2="136" />
    <line x1="0" y1="204" x2="540" y2="204" />
    <line x1="0" y1="272" x2="540" y2="272" />
    <line x1="90" y1="0" x2="90" y2="340" />
    <line x1="180" y1="0" x2="180" y2="340" />
    <line x1="270" y1="0" x2="270" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
  </g>

  <!-- Background Ambient Spotlights -->
  <circle cx="100" cy="145" r="70" fill="#86efac" opacity="0.04" filter="url(#accentGlow)" />
  <circle cx="430" cy="145" r="70" fill="#38bdf8" opacity="0.04" filter="url(#accentGlow)" />

  <!-- ================= LEFT: AI NEURAL CORE ================= -->
  <g id="ai-processor">
    <!-- Outer Shield -->
    <rect x="52" y="97" width="96" height="96" rx="16" fill="#141720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <rect x="60" y="105" width="80" height="80" rx="12" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Rotating Concentric Tech Rings -->
    <g class="core-rings">
      <circle cx="100" cy="145" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="8 6" />
      <circle cx="100" cy="145" r="22" fill="none" stroke="#86efac" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="14 10" />
    </g>

    <!-- Center AI Core Indicator -->
    <circle cx="100" cy="145" r="12" fill="#1e222d" stroke="#86efac" stroke-width="1.5" />
    <circle cx="100" cy="145" r="6" fill="#86efac" class="led-emerald" />

    <!-- Core Label -->
    <text x="100" y="210" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="1">AI ENGINE</text>
  </g>

  <!-- Data Bus Connecting Core to Server Rack -->
  <path d="M 148 145 L 210 145" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <path d="M 148 145 L 210 145" fill="none" stroke="#86efac" stroke-width="2" class="stream-line" />

  <!-- ================= CENTER: SERVER BLADES ================= -->
  <g id="server-chassis">
    <!-- Server Case Frame -->
    <rect x="210" y="55" width="280" height="180" rx="12" fill="url(#glassChassis)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

    <!-- Scanning Line Effect -->
    <g clip-path="url(#chassisClip)">
      <clipPath id="chassisClip">
        <rect x="210" y="55" width="280" height="180" rx="12" />
      </clipPath>
      <line x1="210" y1="55" x2="490" y2="55" stroke="#86efac" stroke-width="2" opacity="0.4" class="scanner" />
    </g>

    <!-- Blade Unit 1: FastAPI API Node -->
    <rect x="224" y="70" width="252" height="42" rx="8" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="242" cy="91" r="4" fill="#86efac" class="led-emerald" />
    <circle cx="254" cy="91" r="4" fill="#38bdf8" class="led-cyan" />
    <text x="272" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">FASTAPI WORKER 01</text>
    <text x="272" y="101" font-family="'Inter', monospace, sans-serif" font-size="9" fill="#9ca3af">PORT: 8000 • STATUS: ACTIVE</text>
    <rect x="426" y="85" width="38" height="14" rx="4" fill="#86efac" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.3" stroke-width="1" />
    <text x="445" y="95" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#86efac">200 OK</text>

    <!-- Blade Unit 2: PostgreSQL Storage Node -->
    <rect x="224" y="122" width="252" height="42" rx="8" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="242" cy="143" r="4" fill="#86efac" class="led-emerald-alt" />
    <circle cx="254" cy="143" r="4" fill="#ffffff" opacity="0.3" />
    <text x="272" y="140" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">POSTGRESQL (RENDER)</text>
    <text x="272" y="153" font-family="'Inter', monospace, sans-serif" font-size="9" fill="#9ca3af">HOST: OREGON • POOL: READY</text>
    <rect x="426" y="137" width="38" height="14" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="445" y="147" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#38bdf8">LINKED</text>

    <!-- Blade Unit 3: Channel Delivery Stub -->
    <rect x="224" y="174" width="252" height="42" rx="8" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="242" cy="195" r="4" fill="#86efac" class="led-emerald" />
    <circle cx="254" cy="195" r="4" fill="#86efac" class="led-emerald-alt" />
    <text x="272" y="192" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">CHANNEL SERVICE STUB</text>
    <text x="272" y="205" font-family="'Inter', monospace, sans-serif" font-size="9" fill="#9ca3af">PORT: 8001 • ASYNC DISPATCH</text>
    <rect x="426" y="189" width="38" height="14" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="445" y="199" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#9ca3af">IDLE</text>
  </g>

  <!-- ================= BOTTOM: SLEEK STATUS CONSOLE ================= -->
  <g id="bottom-console">
    <!-- Recessed Console Bar -->
    <rect x="40" y="260" width="460" height="48" rx="12" fill="#0c0e14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- Terminal Indicator -->
    <circle cx="62" cy="284" r="5" fill="#86efac" class="led-emerald" />

    <text x="80" y="288" font-family="'Inter', monospace, sans-serif" font-size="11" font-weight="600" fill="#e5e7eb" letter-spacing="0.5">
      CLUSTER: <tspan fill="#86efac">ALL MICROSERVICES ONLINE</tspan>
    </text>

    <!-- Elegant Progress Line -->
    <g clip-path="url(#barClip)">
      <clipPath id="barClip">
        <rect x="360" y="280" width="124" height="8" rx="4" />
      </clipPath>
      <rect x="360" y="280" width="124" height="8" rx="4" fill="#1f2430" />
      <rect x="360" y="280" width="124" height="8" rx="4" fill="url(#emeraldGrad)" />
      <!-- Shimmer pulse -->
      <rect x="340" y="280" width="40" height="8" fill="#ffffff" opacity="0.4" class="shimmer" />
    </g>
  </g>
</svg>
