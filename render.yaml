databases:
  - name: crm-db
    plan: free

services:
  - type: web
    name: crm-backend
    env: python
    plan: free
    buildCommand: "pip install uv && cd backend && uv sync"
    startCommand: "cd backend && uv run alembic upgrade head && uv run python scripts/seed_data.py && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CHANNEL_STUB_URL
        value: "https://channel-stub-ugn2.onrender.com"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
        
  - type: web
    name: channel-stub
    env: python
    plan: free
    buildCommand: "pip install uv && cd backend && uv sync"
    startCommand: "cd backend/channel_stub && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CRM_BACKEND_URL
        value: "https://crm-backend-15tu.onrender.com"
