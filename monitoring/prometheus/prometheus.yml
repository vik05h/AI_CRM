global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "aicrm-backend"
    metrics_path: "/health"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8000", "localhost:8000", "backend:8000"]

  - job_name: "aicrm-stub"
    metrics_path: "/"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8001", "localhost:8001", "channel_stub:8001"]
